<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F2F0FA" />
    <title>Omnia — Client demos</title>
    <link rel="icon" href="/assets/omnia-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/demos/demo.css" />
    <script type="module" src="/demos/index.js"></script>
  </head>
  <body class="launcher">
    <header class="launch-head">
      <a class="brand-lockup" href="/demos/" aria-label="Omnia demos">
        <svg viewBox="0 0 430 440" aria-hidden="true">
          <path fill="#5B45D6" d="M228 70h-58Q70 70 70 170v68h74v-56q0-38 38-38h46Z" />
          <path fill="#69E3C0" d="M246 70h16q98 0 98 98v50h-74v-36q0-38-40-38Z" />
          <path fill="#5B45D6" d="M360 236v38q0 96-96 96h-74v-74h58q38 0 38-38v-22Z" />
          <path fill="#5B45D6" d="M70 256v18q0 96 98 96h4v-74q-28 0-28-38v-2Z" />
        </svg>
        <span>OMNIA</span>
      </a>
      <span class="launch-tag">Client demos</span>
      <a class="launch-exit" href="/demos/logout">Lock</a>
    </header>

    <main class="launch-main">
      <h1>Three workspaces we built.</h1>
      <p class="launch-sub">
        Each one is a live workspace for a different operation — the dashboards,
        decisions and agents that company actually uses. Same Omnia underneath.
      </p>

      <div class="launch-grid" id="launchGrid"></div>

      <p class="launch-note">
        Sample data throughout. Nothing here is connected to a client's real systems.
      </p>
    </main>
  </body>
</html>
