<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F2F0FA" />
    <title>Omnia — Workspace</title>
    <link rel="icon" href="/assets/omnia-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/demos/demo.css" />
    <script src="/assets/vendor/gsap.min.js" defer></script>
    <script src="/assets/vendor/chart.umd.min.js" defer></script>
    <script type="module" src="/demos/demo.js"></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <defs>
        <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.2"/></symbol>
        <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 19 6v6c0 4.4-3 7.4-7 8.5-4-1.1-7-4.1-7-8.5V6z"/><path d="m9 12 2 2 4-4"/></symbol>
        <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M4 8.5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1.2a2.3 2.3 0 0 0 0 4.6v1.2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1.2a2.3 2.3 0 0 0 0-4.6z"/><path d="M13.5 7v10" stroke-dasharray="2 2.4"/></symbol>
        <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/><path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></symbol>
        <symbol id="i-agent" viewBox="0 0 24 24"><rect x="4" y="6.5" width="16" height="12" rx="4.5"/><path d="M12 3v3.5M9 12.5v1.5M15 12.5v1.5M2.5 11v3M21.5 11v3"/></symbol>
        <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></symbol>
        <symbol id="i-boxes" viewBox="0 0 24 24"><path d="M3.5 8.5 12 4l8.5 4.5v7L12 20l-8.5-4.5z"/><path d="M3.5 8.5 12 13l8.5-4.5M12 13v7"/></symbol>
        <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/></symbol>
        <symbol id="i-team" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0M16.5 5.5a3.5 3.5 0 0 1 0 6.4M18 20a6 6 0 0 0-2.4-4.6"/></symbol>
        <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a3.5 3.5 0 0 0 5 0l3-3a3.54 3.54 0 0 0-5-5l-1.5 1.5"/><path d="M14 10a3.5 3.5 0 0 0-5 0l-3 3a3.54 3.54 0 0 0 5 5l1.5-1.5"/></symbol>
        <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3.5 21 8l-9 4.5L3 8z"/><path d="M3 12.5 12 17l9-4.5M3 16.5 12 21l9-4.5"/></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
        <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6.5 10a5.5 5.5 0 0 1 11 0c0 4 1.5 5.5 1.5 5.5H5S6.5 14 6.5 10Z"/><path d="M10 19a2.2 2.2 0 0 0 4 0"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
        <symbol id="i-send" viewBox="0 0 24 24"><path d="M4.5 12 20 5l-4 15-4.5-6z"/><path d="M11.5 14 20 5"/></symbol>
        <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M2.5 12.5h4L9 6l3.5 12 3-8 2 2.5h4"/></symbol>
        <symbol id="i-card" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="M2.5 10.5h19"/></symbol>
        <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3.5h7l5 5v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1Z"/><path d="M13 3.5v5h5M8.5 13h7M8.5 16.5h4.5"/></symbol>
        <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M4.2 7.5l1.9 1.1M17.9 15.4l1.9 1.1M4.2 16.5l1.9-1.1M17.9 8.6l1.9-1.1"/></symbol>
        <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4.5H6.5a1.5 1.5 0 0 0-1.5 1.5v12a1.5 1.5 0 0 0 1.5 1.5H14"/><path d="M17 8.5 20.5 12 17 15.5M10 12h10"/></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5 21 19.5H3z"/><path d="M12 10v4M12 17v.5"/></symbol>
        <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m4 7 8 6 8-6"/></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m6 6-6-6 6-6"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"/></symbol>
      </defs>
    </svg>

    <nav class="nav" id="topbar" aria-label="Workspace navigation">
      <a class="nav-brand" href="/demos/" aria-label="Omnia demos" id="navBrand">
        <svg viewBox="0 0 430 440" aria-hidden="true">
          <path fill="#5B45D6" d="M228 70h-58Q70 70 70 170v68h74v-56q0-38 38-38h46Z" />
          <path fill="#69E3C0" d="M246 70h16q98 0 98 98v50h-74v-36q0-38-40-38Z" />
          <path fill="#5B45D6" d="M360 236v38q0 96-96 96h-74v-74h58q38 0 38-38v-22Z" />
          <path fill="#5B45D6" d="M70 256v18q0 96 98 96h4v-74q-28 0-28-38v-2Z" />
        </svg>
      </a>

      <div class="nav-bubble nav-dashboards">
        <div class="tabs" id="tabs" role="tablist" aria-label="Dashboards"></div>
      </div>

      <div class="nav-right">
        <button class="nav-bubble nav-ask" id="askButton" type="button" aria-expanded="false" aria-controls="dock">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-spark" /></svg>
          <span>Ask Omnia</span>
        </button>
        <button class="nav-bubble nav-agents" id="agentsButton" type="button" aria-expanded="false" aria-controls="dock">
          <i></i><b id="agentsChipCount">3</b><span>agents</span>
        </button>
        <button class="nav-bubble nav-engineer" id="dockButton" type="button" aria-expanded="false" aria-controls="dock">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mail" /></svg>
          <span>Your engineer</span>
          <i class="badge" id="dockBadge" hidden></i>
        </button>
        <button class="nav-circle" id="searchButton" type="button" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search" /></svg>
        </button>
        <button class="nav-circle" id="bell" type="button" aria-label="Notifications" data-action="notify">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bell" /></svg>
          <i class="badge" id="badge" hidden></i>
        </button>
        <div class="account-wrap">
          <button class="nav-circle nav-avatar" id="accountButton" type="button" aria-expanded="false" aria-haspopup="menu" aria-label="Maya Ortiz">
            <span class="avatar">MO</span>
          </button>
          <div class="menu account-menu" id="accountMenu" role="menu" hidden>
            <div class="menu-head"><strong>Maya Ortiz</strong><span>Workspace admin</span></div>
            <button class="menu-item" role="menuitem" type="button" data-action="workspace">
              <span class="workspace-mark">M</span><span>Meridian Outfitters</span>
              <svg class="menu-end" viewBox="0 0 24 24"><use href="#i-chevron" /></svg>
            </button>
            <div class="menu-sep"></div>
            <button class="menu-item" role="menuitem" type="button" data-action="manage-os"><svg viewBox="0 0 24 24"><use href="#i-gear" /></svg><span>Manage Omnia OS</span><kbd>G</kbd></button>
            <button class="menu-item" role="menuitem" type="button" data-action="people"><svg viewBox="0 0 24 24"><use href="#i-team" /></svg><span>People &amp; access</span></button>
            <button class="menu-item" role="menuitem" type="button" data-action="requests"><svg viewBox="0 0 24 24"><use href="#i-ticket" /></svg><span>Your requests</span></button>
            <div class="menu-sep"></div>
            <a class="menu-item" role="menuitem" href="/demos/logout"><svg viewBox="0 0 24 24"><use href="#i-logout" /></svg><span>Lock this demo</span></a>
          </div>
        </div>
      </div>
    </nav>

    <main class="stage" id="stage" tabindex="-1"></main>

    <aside class="dock" id="dock" aria-label="Ayesha and agents" hidden>
      <div class="dock-head">
        <div class="dock-title" id="dockTitle"></div>
        <button class="icon-button" type="button" data-dock-close aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x" /></svg>
        </button>
      </div>
      <div class="dock-body" id="dockBody"></div>
    </aside>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Details" hidden></aside>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
    </div>

    <div class="palette-backdrop" id="paletteBackdrop" hidden>
      <div class="palette" role="dialog" aria-modal="true" aria-label="Search workspace">
        <div class="palette-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search" /></svg>
          <input id="paletteInput" type="text" placeholder="Search decisions, requests, dashboards" autocomplete="off" />
          <kbd>esc</kbd>
        </div>
        <div class="palette-results" id="paletteResults"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
